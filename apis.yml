aid: hubilo
name: hubilo
description: >-
  Hubilo (now branded Virtual PRO) is an enterprise virtual, hybrid, and in-person event
  platform used by conference producers and corporate event teams to create, promote, run, and
  analyze multi-session, multi-day events. Its Public API v1.2 lets organisers manage events,
  agenda sessions and tracks, speakers, attendees (users) and member groups, exhibitor booths,
  the organiser profile, and media uploads, plus a webhooks surface for activity notifications.
  Authentication is an organiser-level Access Token (Authorization: Bearer) and the API enforces
  a combined limit of 20 requests per second per organiser. Hubilo is a portfolio company of
  Balderton Capital.
